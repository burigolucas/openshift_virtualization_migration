name: Fork CI

# ============================================================================
# WORKFLOW: FULL CI FOR FORK CONTRIBUTORS
# ============================================================================
#
# Enables contributors to run the full CI test suite in their own forks
# before creating a PR to upstream. Requires AUTOMATION_HUB_TOKEN configured
# in the fork's repository secrets.
#
# HOW IT WORKS:
# -------------
# 1. Triggers on push to any feature branch (excludes main/v2)
# 2. Only runs in fork repositories (skips silently in upstream)
# 3. Syncs the latest upstream version tag to the fork (required for
#    changelog-lint version resolution — runs automatically before ci)
# 4. Calls the same reusable CI workflow used by the upstream CI
# 5. Uses the fork's own AUTOMATION_HUB_TOKEN secret
# 6. Disables release and publishing operations
#
# SETUP (for contributors):
# -------------------------
# 1. Enable GitHub Actions in your fork (Actions tab > enable workflows)
# 2. Add AUTOMATION_HUB_TOKEN to your fork's repository secrets
#    (Settings > Secrets and variables > Actions > New repository secret)
# 3. Push to any feature branch — this workflow runs automatically
#
# See CONTRIBUTING.md for detailed setup instructions.
#
# ============================================================================

on:
  push:
    branches-ignore:
      - main
      - v2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    if: github.repository != 'redhat-cop/openshift_virtualization_migration'
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - name: Create upstream version tag in fork for changelog-lint version resolution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the latest semver tag name and its exact commit SHA from upstream
          TAGS_JSON=$(gh api repos/redhat-cop/openshift_virtualization_migration/tags)
          LATEST_TAG=$(echo "$TAGS_JSON" | \
            jq -r '[.[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].name')
          UPSTREAM_SHA=$(echo "$TAGS_JSON" | \
            jq -r '[.[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].commit.sha')

          if [[ -z "$LATEST_TAG" || "$LATEST_TAG" == "null" ]]; then
            echo "::warning::Could not determine the latest upstream tag. Changelog-lint may fail."
            exit 0
          fi

          echo "Latest upstream release: ${LATEST_TAG} (${UPSTREAM_SHA})"

          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          MAIN_SHA=$(gh api "repos/${{ github.repository }}/commits/${DEFAULT_BRANCH}" \
            --jq '.sha')

          # Verify the fork's default branch is at or ahead of the upstream release commit.
          # 'ahead' or 'identical' means the fork includes the release — the tag will be correct.
          # 'behind' or 'diverged' means the fork is stale: fail with a clear actionable error
          # rather than silently creating a tag that points to the wrong base commit, which
          # would cause semantic-release to treat upstream changes as unreleased.
          COMPARE_STATUS=$(gh api \
            "repos/${{ github.repository }}/compare/${UPSTREAM_SHA}...${MAIN_SHA}" \
            --jq '.status' 2>/dev/null || echo "error")

          if [[ "$COMPARE_STATUS" == "behind" || "$COMPARE_STATUS" == "diverged" ]]; then
            echo "::error::Your fork's '${DEFAULT_BRANCH}' branch is behind the upstream ${LATEST_TAG} release."
            echo "::error::Sync your default branch before running CI to ensure the version tag points"
            echo "::error::to the correct base commit and semantic-release computes versions accurately:"
            echo "::error::  git fetch upstream && git push origin ${DEFAULT_BRANCH}"
            exit 1
          fi

          if [[ "$COMPARE_STATUS" == "error" ]]; then
            echo "::warning::Could not verify fork sync status against upstream ${LATEST_TAG} — proceeding anyway."
          else
            echo "Fork's ${DEFAULT_BRANCH} includes upstream ${LATEST_TAG} ✓ (compare: ${COMPARE_STATUS})"
          fi

          # Point the tag at the fork's default branch HEAD rather than directly at
          # UPSTREAM_SHA. GITHUB_TOKEN lacks the 'workflow' OAuth scope required to
          # create tags referencing upstream release commits, which contain older
          # workflow file versions. Since we verified above that MAIN_SHA is at or
          # ahead of UPSTREAM_SHA, this is semantically equivalent for semantic-release:
          # all contributor commits on the feature branch are correctly identified as
          # unreleased since ${LATEST_TAG}.
          echo "Tagging ${LATEST_TAG} → ${MAIN_SHA} (fork's ${DEFAULT_BRANCH} HEAD)"

          if gh api --method POST "repos/${{ github.repository }}/git/refs" \
              -f "ref=refs/tags/${LATEST_TAG}" \
              -f "sha=${MAIN_SHA}" 2>/dev/null; then
            echo "Tag ${LATEST_TAG} created successfully"
          else
            gh api --method PATCH "repos/${{ github.repository }}/git/refs/tags/${LATEST_TAG}" \
              -f "sha=${MAIN_SHA}" \
              -F "force=true" 2>/dev/null \
              && echo "Tag ${LATEST_TAG} updated to current ${DEFAULT_BRANCH} HEAD" \
              || echo "::warning::Could not update tag ${LATEST_TAG}"
          fi

  ci:
    needs: sync-tags
    if: github.repository != 'redhat-cop/openshift_virtualization_migration'
    uses: redhat-cop/openshift_virtualization_migration_ci/.github/workflows/ci-ansible-collection.yml@v2
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
      pull-requests: write
    with:
      ref: ${{ github.sha }}
      repo: ${{ github.repository }}
      trigger_release: false
      auto_merge: false
      publish_to_automation_hub: false
    secrets:
      automation_hub_token: ${{ secrets.AUTOMATION_HUB_TOKEN }}
      release_app_id: ${{ secrets.RELEASE_APP_ID }}
      release_app_private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
